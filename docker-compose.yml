# RMI Backend — Production Docker Compose
# ========================================
# Startup order (strict):
#   1. DNS (external — handled by Docker DNS)
#   2. Databases: Redis → PostgreSQL → ClickHouse → Neo4j → Qdrant
#   3. Supporting services: MinIO, Redpanda
#   4. Application: rmi-backend (waits for all DBs via depends_on + healthcheck)
#   5. Monitoring: Prometheus, Grafana, Langfuse (optional)
#
# Usage:
#   docker compose --env-file .env up -d
#
# Security: run with read-only rootfs and dropped capabilities:
#   docker compose --env-file .env up -d
#
# Verify:
#   curl -f http://localhost:8000/live    # liveness
#   curl -f http://localhost:8000/ready   # readiness
#   curl -f http://localhost:8000/health  # full health

name: rmi

services:
  # ════════════════════════════════════════════════════════════
  # LAYER 1: DNS (Docker built-in) — no service needed
  # ════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════
  # LAYER 2: Databases (order: cache → primary → analytics)
  # ════════════════════════════════════════════════════════════
  rmi-redis:
    image: redis:7-alpine
    container_name: rmi-redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
                   --appendonly yes
                   --maxmemory 512mb
                   --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - rmi_network
    ports:
      - "127.0.0.1:6379:6379"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

  rmi-postgres:
    image: postgres:16-alpine
    container_name: rmi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rmi
      POSTGRES_USER: rmi
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD?DATABASE_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmi -d rmi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rmi_network
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

  rmi-clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: rmi-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: rmi
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-rmi}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - rmi_network
    ports:
      - "8123:8123"
      - "9000:9000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
      - NET_BIND_SERVICE

  rmi-neo4j:
    image: neo4j:5-community
    container_name: rmi-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - rmi_network
    ports:
      - "7474:7474"
      - "7687:7687"
    profiles:
      - full

  rmi-qdrant:
    image: qdrant/qdrant:v1.12
    container_name: rmi-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rmi_network
    ports:
      - "127.0.0.1:6333:6333"
    profiles:
      - full

  # ════════════════════════════════════════════════════════════
  # LAYER 2.5: AI — Ollama (LLM generation only; RAG embeddings/reranking use Infinity)
  # ════════════════════════════════════════════════════════════
  rmi-ollama:
    image: ollama/ollama:latest
    container_name: rmi-ollama
    restart: unless-stopped
    mem_limit: 8g
    cpus: '4.0'
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m           # Unload models after 5min idle
      OLLAMA_NUM_PARALLEL: 2          # Max 2 parallel requests
      OLLAMA_NUM_THREADS: 4
      OLLAMA_CONTEXT_LENGTH: 4096
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_MAX_LOADED_MODELS: 2           # Only keep 2 models in RAM
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - rmi_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ════════════════════════════════════════════════════════════
  # LAYER 3: Supporting services
  # ════════════════════════════════════════════════════════════
  rmi-minio:
    image: minio/minio:latest
    container_name: rmi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-rmi}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rmi_network
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles:
      - full

  rmi-redpanda:
    image: redpandadata/redpanda:latest
    container_name: rmi-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rmi_network
    profiles:
      - full

  # ════════════════════════════════════════════════════════════
  # LAYER 4: Application
  # ════════════════════════════════════════════════════════════
  rmi-backend:
    build:
      context: .
      dockerfile: Dockerfile.multistage
      args:
        # INSTALL_FACE=1 adds ML face engines (insightface/deepface/dlib) +
        # pre-baked buffalo_l models (~+1GB image). Default: CLI tools + Haar
        # cascade only — /osint /track /face still work.
        INSTALL_FACE: ${INSTALL_FACE:-0}
    container_name: rmi-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Point PostgreSQL client to the Docker container instead of localhost
      POSTGRES_HOST: rmi-postgres
      # RAG embeddings/reranking (Infinity OpenAI-compatible server)
      INFINITY_URL: http://infinity-rag:8001
      # RAG vector store: point at the populated rmi-qdrant-v2 instance
      # (rmi-qdrant v1 is an empty 4-collection shell; v2 holds the live data).
      QDRANT_URL: http://rmi-qdrant-v2:6333
    depends_on:
      rmi-redis:
        condition: service_healthy
      rmi-postgres:
        condition: service_healthy
      rmi-clickhouse:
        condition: service_started
    volumes:
      - /tmp:/tmp
      - /dev/shm:/dev/shm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - rmi_network
    ports:
      - "127.0.0.1:8000:8000"
    # Security hardening
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  rmi-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rmi-worker
    restart: unless-stopped
    env_file: .env
    environment:
      # Point PostgreSQL client to the Docker container instead of localhost
      POSTGRES_HOST: rmi-postgres
      # RAG embeddings/reranking (Infinity OpenAI-compatible server)
      INFINITY_URL: http://infinity-rag:8001
    depends_on:
      rmi-redis:
        condition: service_healthy
      rmi-postgres:
        condition: service_healthy
      rmi-backend:
        condition: service_started
    volumes:
      - /tmp:/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0) if os.path.exists('/proc/self/status') else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rmi_network
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    profiles:
      - full

  # ════════════════════════════════════════════════════════════
  # LAYER 5: Monitoring (optional — enable with --profile full)
  # ════════════════════════════════════════════════════════════
  rmi-prometheus:
    image: prom/prometheus:latest
    container_name: rmi-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rmi_network
    ports:
      - "9090:9090"
    profiles:
      - full

  rmi-grafana:
    image: grafana/grafana:latest
    container_name: rmi-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - rmi-prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - rmi_network
    ports:
      - "3000:3000"
    profiles:
      - full

networks:
  rmi_network:
    name: rmi_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-data:
  postgres-data:
  clickhouse-data:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
  minio-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
  ollama-data:
