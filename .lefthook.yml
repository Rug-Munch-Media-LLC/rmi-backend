pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner --verbose
    envsitter:
      run: envsitter validate --file .env
    ruff:
      run: ruff check {files}
      glob: "*.py"
    biome:
      run: npx biome check --write {staged_files} 2>/dev/null; true
    shellcheck:
      run: shellcheck {files}
      glob: "*.sh"

pre-push:
  parallel: true
  commands:
    mypy:
      run: mypy .
    bandit:
      run: bandit -c pyproject.toml -r .
    deptry:
      run: deptry . || echo "deptry warnings (non-blocking)"

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1"
