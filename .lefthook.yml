pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner --verbose
    envsitter:
      run: envsitter validate --file .env
    ruff:
      run: ruff check {files}
      glob: "*.py"
    biome:
      run: npx biome check --write {staged_files} 2>/dev/null; true
    shellcheck:
      run: shellcheck {files}
      glob: "*.sh"

pre-push:
  parallel: true
  commands:
    mypy:
      run: mypy app/ --ignore-missing-imports || echo "mypy warnings — see CI for results"
    bandit:
      run: bandit -r app/ -ll || echo "bandit warnings — see CI for results"
    deptry:
      run: deptry . || echo "deptry warnings — see CI for results"

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1"
