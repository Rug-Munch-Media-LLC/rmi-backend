name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PRs MUST pass all CI jobs before merge
# Coverage thresholds below enforce quality gates

env:
  COVERAGE_THRESHOLD: 70
  PYTHON_VERSION: "3.11"

jobs:
  bandit:
    runs-on: docker-x64
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install bandit
        run: pip install bandit
      - name: Bandit SAST scan
        run: bandit -r app/ -ll -f json -o bandit-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  shellcheck:
    runs-on: docker-x64
    container:
      image: koalaman/shellcheck-alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/sdks/*" -exec shellcheck -x {} +
      - name: Bash Syntax
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/sdks/*" -exec bash -n {} \;

  build-and-test:
    runs-on: docker-x64
    container:
      image: python:${PYTHON_VERSION}-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh -o /tmp/uv-install.sh
          echo "b7b3fe80cad1142a2a5794050b7db7b3291d1bac1423b0732571dd9366e8ca8b /tmp/uv-install.sh" | sha256sum -c
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Python
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv venv --python ${{ env.PYTHON_VERSION }} .venv

      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        run: source .venv/bin/activate && ruff check . --exit-non-zero-on-fix

      - name: Format check (ruff)
        run: source .venv/bin/activate && ruff format --check .

      - name: Type check (mypy)
        run: source .venv/bin/activate && mypy app/ --ignore-missing-imports
        continue-on-error: true

      - name: Run unit + integration tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/ -x -q --tb=short \
            --cov=app \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Run E2E tests
        run: |
          source .venv/bin/activate
          pytest tests/e2e/ -x -q --tb=short \
            --cov=app \
            --cov-report=term \
            --cov-report=xml:coverage-e2e.xml \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} || echo "E2E tests noted (non-blocking for coverage)"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  trivy-scan:
    runs-on: docker-x64
    needs: build-and-test
    steps:
      - name: Scan backend image for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend-rmi-backend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'