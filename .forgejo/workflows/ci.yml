  pip-audit:
    runs-on: docker-x64
    needs: build-and-test
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
