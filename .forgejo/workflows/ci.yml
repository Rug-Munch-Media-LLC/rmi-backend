name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # k6 smoke tests run against live deployment every 6 hours
    - cron: '0 */6 * * *'

# PRs MUST pass all CI jobs before merge
# Coverage thresholds below enforce quality gates

env:
  COVERAGE_THRESHOLD: 70
  PYTHON_VERSION: "3.11"

jobs:
  pre-commit-mirror:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + pre-commit
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
          rm -rf /var/lib/apt/lists/*
          pip install pre-commit
      - name: Run ALL pre-commit hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure

  commitlint:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Need full history to check all commits in PR
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Check all commits in the PR
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            # On push to main, just check the latest commit
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  changelog-check:
    # git-cliff gate: on tagged releases, verify a non-empty changelog can be
    # generated from conventional commits. Operates on a temp file so the
    # committed CHANGELOG.md (curated) is never clobbered by CI.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: docker-x64
    container:
      image: localhost/ci-alpine-node:3.19
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Need tags for git-cliff version detection
      - name: Install git-cliff
        run: |
          apk add --no-cache curl tar
          # musl build — the container is alpine (musl libc); the gnu build
          # fails with "not found" (loader mismatch).
          curl -fsSL https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-musl.tar.gz -o /tmp/git-cliff.tar.gz
          tar xzf /tmp/git-cliff.tar.gz -C /usr/local/bin --strip-components=1 git-cliff-2.13.1/git-cliff
          git-cliff --version
      - name: Generate changelog (to temp file) and verify non-empty
        run: |
          git-cliff --config cliff.toml --output /tmp/CHANGELOG.generated.md
          if [ ! -s /tmp/CHANGELOG.generated.md ]; then
            echo "❌ git-cliff produced an empty changelog for tag ${{ github.ref_name }}"
            exit 1
          fi
          echo "✅ Changelog generated ($(wc -l < /tmp/CHANGELOG.generated.md) lines)"
          head -40 /tmp/CHANGELOG.generated.md

  semgrep:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep SAST scan (community rules)
        run: |
          semgrep --config=auto \
            --error \
            --severity=ERROR \
            --exclude='tests/' \
            --exclude='alembic/' \
            --exclude='app/_archive/' \
            --exclude='app/legacy/' \
            --sarif=semgrep.sarif \
            app/
      - uses: actions/upload-artifact@v3
        with:
          name: semgrep-report
          path: semgrep.sarif

  aiverify:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install aiverify
        run: pip install aiverify-cli 2>/dev/null || echo "aiverify install skipped"
        continue-on-error: true
      - name: Detect AI hallucinations
        run: |
          if command -v aiverify &>/dev/null; then
            aiverify app/ --json || echo "AI-specific issues found — review needed"
          else
            echo "aiverify not installed — skipping"
          fi
        continue-on-error: true
      - uses: actions/upload-artifact@v3
        with:
          name: aiverify-report
          path: aiverify-output.json
        continue-on-error: true

  squawk:
    # Squawk lints PostgreSQL migration SQL files (*.sql). Current migrations
    # are Alembic Python (.py) files, so there are no .sql files to lint yet.
    # The gate will activate when .sql migration files are added to
    # alembic/versions/ or migrations/ directories.
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Squawk
        run: npm install -g squawk-cli
      - name: Lint Postgres migrations
        run: |
          SQL_FILES=$(find alembic/versions migrations -name "*.sql" 2>/dev/null || true)
          if [ -n "$SQL_FILES" ]; then
            COUNT=$(echo "$SQL_FILES" | wc -l)
            echo "=== Squawk: linting $COUNT SQL migration file(s) ==="
            echo "$SQL_FILES" | xargs squawk || echo "Squawk found issues — review migration files"
          else
            PY_COUNT=$(find alembic/versions -name "*.py" 2>/dev/null | wc -l)
            echo "No SQL migration files found ($PY_COUNT Python Alembic files present)."
            echo "Gate will activate when .sql migration files are added."
          fi
      - name: Migration file inventory
        run: |
          echo "=== Migration File Inventory ==="
          PY_COUNT=$(find alembic/versions -name "*.py" 2>/dev/null | wc -l)
          SQL_COUNT=$(find alembic/versions -name "*.sql" 2>/dev/null | wc -l)
          echo "  Python (Alembic): $PY_COUNT files"
          echo "  SQL (Squawk):     $SQL_COUNT files"
          if [ -d "migrations" ]; then
            MIG_SQL=$(find migrations -name "*.sql" 2>/dev/null | wc -l)
            echo "  SQL (migrations/): $MIG_SQL files"
          fi

  sql-lint:
    # sqlfluff SQL lint gate. Root .sqlfluff defaults to postgres; per-dir
    # .sqlfluff overrides set clickhouse for app/db/clickhouse_migrations/
    # and infra/. .sqlfluffignore excludes the ClickHouse TTL file whose
    # MODIFY TTL ... DELETE syntax the clickhouse dialect cannot parse yet.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install sqlfluff
        run: pip install sqlfluff==4.3.0
      - name: Lint SQL files (structural rules)
        run: |
          sqlfluff lint . --nocolor
      - name: Report linted files
        run: |
          SQL_FILES=$(find . -name "*.sql" -not -path "./.venv/*" -not -path "./.git/*" 2>/dev/null)
          echo "=== SQL files in repo: $(echo "$SQL_FILES" | grep -c . ) ==="
          echo "$SQL_FILES"

  api-lint:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates nodejs npm && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli
      - name: Export OpenAPI schema
        run: |
          source .venv/bin/activate
          python -c "
          import json, sys
          sys.path.insert(0, '.')
          from app.main import app
          schema = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2)
          "
      - name: Lint OpenAPI with Spectral
        run: spectral lint openapi.json --ruleset .spectral.yaml --fail-severity=error
      - uses: actions/upload-artifact@v3
        with:
          name: openapi-schema
          path: openapi.json

  oasdiff:
    # Detects BREAKING OpenAPI changes introduced by a PR.
    # openapi.json is gitignored and regenerated per run (see api-lint), so
    # the committed-vs-generated comparison is impossible. Instead we
    # generate the schema from the app at PR HEAD and at PR BASE (main) and
    # diff them with the oasdiff binary; --fail-on ERR makes breaking
    # changes block the pipeline.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install system deps + uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.11.7/oasdiff_1.11.7_linux_amd64.tar.gz -o /tmp/oasdiff.tar.gz
          tar xzf /tmp/oasdiff.tar.gz -C /usr/local/bin oasdiff
          oasdiff --version
      - name: Generate OpenAPI from app (PR head)
        run: |
          source .venv/bin/activate
          python -c "
          import json, sys
          sys.path.insert(0, '.')
          from app.main import app
          schema = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2)
          "
          cp openapi.json /tmp/openapi-head.json
      - name: Export base tree (PR base / previous main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "No base commit available — skipping oasdiff."
            exit 0
          fi
          git fetch origin "$BASE_SHA" 2>/dev/null || true
          mkdir -p /tmp/rmi-base
          git archive "$BASE_SHA" | tar -x -C /tmp/rmi-base
          echo "Base SHA: $BASE_SHA"
      - name: Generate OpenAPI from app (PR base)
        run: |
          cd /tmp/rmi-base
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "
          import json, sys
          sys.path.insert(0, '.')
          from app.main import app
          schema = app.openapi()
          with open('/tmp/openapi-base.json', 'w') as f:
              json.dump(schema, f, indent=2)
          "
      - name: Detect breaking OpenAPI changes
        run: |
          if [ ! -f /tmp/openapi-base.json ]; then
            echo "No base spec generated — skipping breaking-change diff."
            exit 0
          fi
          oasdiff breaking /tmp/openapi-base.json /tmp/openapi-head.json --fail-on ERR -f githubactions

  import-linter:
    # Enforces architectural layer contracts declared in .importlinter:
    #   1. app.core never imports app.api (layers)
    #   2. app.services never imports app.api/app.routers (forbidden)
    #   3. app.adapters are leaf modules (forbidden)
    # Static analysis only — no application code is imported.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install import-linter
        run: pip install import-linter
      - name: Enforce architectural contracts
        run: lint-imports --config .importlinter

  bandit:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install bandit
        run: pip install bandit
      - name: Bandit SAST scan
        run: bandit -r app/ -ll -f json -o bandit-report.json
      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json

  shellcheck:
    runs-on: docker-x64
    container:
      image: koalaman/shellcheck-alpine:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ShellCheck
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/sdks/*" -exec shellcheck -x {} +
      - name: Bash Syntax
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/sdks/*" -exec bash -n {} \;

  layerlint:
    runs-on: docker-x64
    container:
      image: localhost/ci-alpine-node:3.19
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install layerLint
        run: |
          apk add --no-cache curl tar
          curl -sSL https://github.com/vviveksharma/layerLint/releases/download/v1.0.1/layerLint_1.0.1_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin
          chmod +x /usr/local/bin/layerlint
      - name: Lint Dockerfiles for caching issues
        run: |
          find . -name "Dockerfile*" -not -path "*/node_modules/*" -not -path "*/.venv/*" | while read -r dockerfile; do
            echo "=== $dockerfile ==="
            layerlint scan --dockerfile "$dockerfile" --fail-on-severity high || echo "Caching issues found in $dockerfile"
          done
        continue-on-error: true

  build-and-test:
    runs-on: docker-x64
    container:
      image: python:${PYTHON_VERSION}-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh -o /tmp/uv-install.sh
          echo "b7b3fe80cad1142a2a5794050b7db7b3291d1bac1423b0732571dd9366e8ca8b /tmp/uv-install.sh" | sha256sum -c
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Python
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv venv --python ${{ env.PYTHON_VERSION }} .venv

      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        run: source .venv/bin/activate && ruff check . --exit-non-zero-on-fix

      - name: Format check (ruff)
        run: source .venv/bin/activate && ruff format --check .

      - name: Type check (mypy)
        run: source .venv/bin/activate && mypy app/ --ignore-missing-imports

      - name: Run unit tests with coverage
        # Coverage floor: 60% (matches pyproject.toml [tool.coverage.report] fail_under)
        # Tests MUST pass — blocks the pipeline on failure or insufficient coverage
        run: |
          source .venv/bin/activate
          pytest tests/ -x -q --tb=short -m "not integration" \
            --cov=app \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=lcov:coverage.lcov \
            --cov-fail-under=60

      - name: Check coverage threshold
        run: |
          source .venv/bin/activate
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0))
          print(f'Coverage: {line_rate*100:.1f}%')
          if line_rate < 0.60:
              print('❌ Coverage below 60% threshold')
              exit(1)
          print('✅ Coverage threshold met')
          "

      - name: Run E2E tests
        run: |
          source .venv/bin/activate
          pytest tests/e2e/ -x -q --tb=short \
            --cov=app \
            --cov-report=term \
            --cov-report=xml:coverage-e2e.xml \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} || echo "E2E tests noted (non-blocking for coverage)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unittests
          name: rmi-backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.lcov

  migration-test:
    runs-on: docker-x64
    needs: build-and-test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rmi_test_migrations
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install alembic sqlalchemy psycopg2-binary
          pip install -r requirements.txt 2>/dev/null || true
      - name: Apply all migrations
        run: |
          export ALEMBIC_DATABASE_URL=postgresql://postgres:test@postgres:5432/rmi_test_migrations
          alembic upgrade head && echo "✅ All migrations applied cleanly" || { echo "❌ Migration apply failed"; exit 1; }
      - name: Verify migration history
        run: |
          export ALEMBIC_DATABASE_URL=postgresql://postgres:test@postgres:5432/rmi_test_migrations
          CURRENT=$(alembic current 2>/dev/null | head -1)
          echo "  Current revision: $CURRENT"
          HEAD=$(alembic heads | head -1)
          echo "  Head revision:    $HEAD"
          if [ "$CURRENT" = "$HEAD" ]; then
            echo "✅ At head revision"
          else
            echo "❌ Not at head ($CURRENT vs $HEAD)"
            exit 1
          fi
      - name: Rollback and re-apply
        run: |
          export ALEMBIC_DATABASE_URL=postgresql://postgres:test@postgres:5432/rmi_test_migrations
          # Downgrade one revision (informational — some migrations lack downgrade)
          if alembic downgrade -1 2>/dev/null; then
            echo "✅ Rollback successful"
            # Re-apply after rollback
            alembic upgrade head && echo "✅ Re-apply successful after rollback" || { echo "❌ Re-apply failed"; exit 1; }
          else
            echo "⚠️  Rollback skipped (migration lacks downgrade path)"
          fi

  deps-freshness:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    needs: build-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check dependency freshness
        run: |
          pip install libyear 2>/dev/null || true
          if [ -f requirements.txt ]; then
            pip install pip-tools && libyear --file requirements.txt || echo "Dep freshness check noted"
          fi
        continue-on-error: true

  k6-smoke:
    # k6 needs a RUNNING backend to test against. In PR CI the full Docker
    # Compose stack (Postgres + Redis + ClickHouse + app) would be required,
    # and secrets (DATABASE_PASSWORD, REDIS_PASSWORD, etc.) are not available
    # in PR context. Runs on schedule against the live deployment instead.
    # To enable: set K6_TARGET_URL as a repo variable (vars) or secret
    # pointing to the deployed API (e.g., https://api.rugmunch.io).
    #
    # Non-blocking (continue-on-error) until the API is available in CI.
    # Graduate to blocking by removing continue-on-error once a test
    # environment is provisioned (e.g., ephemeral Docker Compose stack).
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: docker-x64
    container:
      image: grafana/k6:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create results directory
        run: mkdir -p tests/k6/results
      - name: Connectivity pre-check
        run: |
          echo "🔍 Checking API reachability at ${{ vars.K6_TARGET_URL || 'https://api.rugmunch.io' }} ..."
          curl -sSf -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ vars.K6_TARGET_URL || 'https://api.rugmunch.io' }}/health" \
            --connect-timeout 10 --max-time 15 \
            && echo "✅ API is reachable — proceeding with k6 smoke test" \
            || echo "⚠️  API not reachable — k6 will report failures (non-blocking)"
        continue-on-error: true
      - name: Run k6 smoke test against live deployment
        run: |
          k6 run tests/k6/smoke.js \
            -e BASE_URL=${{ vars.K6_TARGET_URL || 'https://api.rugmunch.io' }} \
            --summary-export=tests/k6/results/smoke-summary.json
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: k6-smoke-report
          path: tests/k6/results/

  mutation-test:
    runs-on: docker-x64
    needs: build-and-test
    continue-on-error: true  # informational only for now
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]" mutmut
      - name: Mutation testing (scoped to app/core)
        run: source .venv/bin/activate && mutmut run --paths-to-mutate app/core/ --test-timeout 10 || echo "Mutation score noted (non-blocking)"
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: mutation-report
          path: |
            .mutmut-cache/
            html/

  crucible-gate:
    runs-on: docker-x64
    needs: build-and-test
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + uv + mutmut
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python mutmut
          # Install crucible if available
          pip install crucible-harden 2>/dev/null || echo "Crucible not on PyPI yet — gate runs mutmut directly"
      - name: Crucible mutation gate (score only, no AI)
        run: |
          source .venv/bin/activate
          if command -v crucible &>/dev/null; then
            crucible score . --module app/core || echo "Crucible gate noted"
          else
            # Fallback: run mutmut directly for the mutation gate
            mutmut run --paths-to-mutate app/core/ 2>/dev/null && mutmut results || echo "Mutation gate noted (non-blocking)"
          fi
        continue-on-error: true

  slow-tests:
    runs-on: docker-x64
    needs: build-and-test
    continue-on-error: true
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Detect slow tests
        run: |
          source .venv/bin/activate
          python -m pytest --durations=10 tests/ -q --tb=short -m "not integration"
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: slow-test-report
          path: /tmp/slow-tests-*.log

  rag-eval-gate:
    # RAG regression gate (G3): golden-set size, hit-rate + faithfulness
    # thresholds, and the rerank/context-budget wiring. Deterministic dry run
    # (no Redis/Qdrant/Infinity required). BLOCKS on regression.
    runs-on: docker-x64
    needs: build-and-test
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Run RAG regression eval gate
        run: |
          source .venv/bin/activate
          bash scripts/rag-eval.sh --dry

  pip-audit:
    runs-on: docker-x64
    needs: build-and-test
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pip-audit + deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*
          pip install pip-audit
          pip install -r requirements.txt
      - name: Run pip-audit (blocking on HIGH/CRITICAL)
        run: |
          pip-audit --fail-on=high --desc --ignore-vulns PYSEC-2024-100 2>&1 || { echo "❌ pip-audit found HIGH/CRITICAL vulnerabilities — fix before merge"; exit 1; }

  trivy-scan:
    runs-on: docker-x64
    needs: build-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image for scanning
        run: docker build -t app:${{ github.sha }} .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
      - uses: actions/upload-artifact@v3
        with:
          name: trivy-results
          path: trivy-results.sarif

  fuzz:
    runs-on: docker-x64
    needs: build-and-test
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]" hypothesis
      - name: Run fuzz tests
        run: |
          source .venv/bin/activate
          HYPOTHESIS_PROFILE=ci python -m pytest tests/fuzz/ -v --tb=short || echo "Fuzz tests noted"
        continue-on-error: true

  contract-verify:
    runs-on: docker-x64
    needs: build-and-test
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup uv + deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]" pact-python
      - name: Download pact files (from consumer CI)
        uses: actions/download-artifact@v3
        continue-on-error: true
        with:
          name: pacts
          path: tests/contract/pacts/
      - name: Verify provider contracts (Pact Broker)
        id: contract-broker
        continue-on-error: true
        run: |
          source .venv/bin/activate
          if [ -n "$PACT_BROKER_URL" ]; then
            python -m pytest tests/contract/ -v --tb=short -m integration
          else
            echo "ℹ️  PACT_BROKER_URL not set — skip broker verification"
          fi
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
      - name: Verify provider against local pact files
        if: steps.contract-broker.outcome == 'skipped' || steps.contract-broker.outcome == 'failure'
        run: |
          source .venv/bin/activate
          if [ -d "tests/contract/pacts" ] && ls tests/contract/pacts/*.json 2>/dev/null; then
            PACT_FILE=$(ls tests/contract/pacts/*.json 2>/dev/null | head -1)
            echo "=== Verifying pact: $PACT_FILE ==="
            pact-verifier --provider-base-url http://localhost:8000 \
              --pact-url "$PACT_FILE" \
              --provider-app-version "${{ github.sha }}" \
            || { echo "❌ Pact verification failed against $PACT_FILE"; exit 1; }
          elif [ -n "${{ secrets.PACT_BROKER_URL }}" ]; then
            echo "ℹ️  Broker verification already attempted — see step above"
          else
            echo "ℹ️  No local pact files and no Pact Broker configured — publish consumer pacts first"
          fi
      - name: Upload provider verification results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: provider-verification
          path: |
            tests/contract/pacts/
            /tmp/pact-verification-*.log

  sbom:
    runs-on: docker-x64
    needs: build-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output: sbom.spdx.json
      - name: Verify SBOM (blocking — bad SBOM = broken build)
        run: |
          if [ -f sbom.spdx.json ]; then
            bash scripts/sbom-verify.sh sbom.spdx.json
          else
            echo "❌ SBOM file not generated"
            exit 1
          fi
      - uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.spdx.json

  sign-image:
    runs-on: docker-x64
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Set up Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "BUILDKIT_PROGRESS=plain" >> $GITHUB_ENV
      - name: Pull build cache
        run: docker pull registry.rugmunch.io/rmi-backend:buildcache || echo "No cache image yet — building from scratch"
      - name: Build Docker image with cache
        run: |
          docker build \
            --cache-from registry.rugmunch.io/rmi-backend:buildcache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t registry.rugmunch.io/rmi-backend:${{ github.sha }} \
            .
      - name: Push cache image
        run: |
          docker tag registry.rugmunch.io/rmi-backend:${{ github.sha }} registry.rugmunch.io/rmi-backend:buildcache
          docker push registry.rugmunch.io/rmi-backend:buildcache
      - name: Push release image
        run: docker push registry.rugmunch.io/rmi-backend:${{ github.sha }}
      - name: Sign image with keyless (OIDC)
        run: |
          cosign sign --yes registry.rugmunch.io/rmi-backend:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity "https://git.rugmunch.io/RugMunchMedia/rmi-backend/.forgejo/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://git.rugmunch.io" \
            registry.rugmunch.io/rmi-backend:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  ocr-review:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Open Code Review
        run: npm install -g @alibaba-group/open-code-review@latest || echo "OCR install skipped (will retry next run)"
        continue-on-error: true
      - name: Configure OCR
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if command -v ocr &>/dev/null; then
            ocr config set llm.url "$OCR_LLM_URL"
            ocr config set llm.auth_token "$OCR_LLM_AUTH_TOKEN"
            ocr config set llm.model "$OCR_LLM_MODEL"
            ocr config set llm.use_anthropic false
            ocr config set llm.extra_body '{"thinking": {"type": "disabled"}}'
            ocr config set language English
          else
            echo "OCR not installed — skipping config"
          fi
        continue-on-error: true
      - name: Run OCR code review
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if command -v ocr &>/dev/null; then
            TARGET_BRANCH="${GITHUB_BASE_REF:-main}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            if [ -n "$HEAD_SHA" ]; then
              git fetch origin "$TARGET_BRANCH" 2>/dev/null || true
              ocr review \
                --from "origin/$TARGET_BRANCH" \
                --to "$HEAD_SHA" \
                --format json \
                > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log || echo "OCR review completed with findings"
              echo "=== OCR result ==="
              cat /tmp/ocr-result.json
            else
              echo "Not a PR event — skipping review"
            fi
          else
            echo "OCR not installed — skipping (non-blocking)"
          fi
        continue-on-error: true
      - name: Upload OCR report
        uses: actions/upload-artifact@v3
        with:
          name: ocr-review-report
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
        continue-on-error: true

  archfit:
    runs-on: docker-x64
    container:
      image: golang:1.22-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install archfit
        run: go install github.com/alexei-led/archfit/cmd/archfit@latest || echo "archfit install skipped"
        continue-on-error: true
      - name: Run architecture fitness check
        run: |
          if command -v archfit &>/dev/null; then
            archfit analyze
          else
            echo "archfit not installed — skipping (non-blocking)"
          fi

  draugr:
    runs-on: docker-x64
    container:
      image: golang:1.22-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Draugr
        run: go install github.com/draugr-dev/draugr@latest || echo "Draugr install skipped"
        continue-on-error: true
      - name: Install scanner tools
        run: |
          if command -v draugr &>/dev/null; then
            draugr tools install || echo "Tool provisioning skipped"
          fi
        continue-on-error: true
      - name: Run supply chain security scan
        run: |
          if command -v draugr &>/dev/null; then
            draugr scan draugr.saga.yaml --fail-on warning --format sarif -o draugr-out/ || echo "Supply chain findings exist"
          else
            echo "Draugr not installed — skipping (use individual scanners instead)"
          fi
        continue-on-error: true
      - name: Upload Draugr SARIF
        uses: actions/upload-artifact@v3
        with:
          name: draugr-sarif
          path: draugr-out/
        continue-on-error: true

  # ── Gitleaks standalone (blocking) ────────────────────────────
  gitleaks:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      - name: Gitleaks (secrets) — MUST block
        run: gitleaks detect --source . --no-banner --exit-code 1 --config .gitleaks.toml
# Append these jobs under `jobs:` in any repo's ci.yml. Self-contained.
  supply-chain:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/latest/download/trufflehog_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (hallucinated/vulnerable deps)
        run: osv-scanner scan source --format table ./ || echo "::warning::OSV findings — triaged baseline, see log"
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --failures-only --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/latest/download/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"

  nightly-api-fuzz:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Schemathesis property-based API fuzzing (live OpenAPI)
        run: |
          pip install schemathesis
          st run --url "${SCHEMA_URL:-http://rmi-backend:8000/openapi.json}" --checks all --max-examples 50 || echo "::warning::API contract violations found"
