  contract-verify:
    runs-on: docker-x64
    needs: build-and-test
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup uv + deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]" pact-python
      - name: Download pact files (from consumer CI)
        uses: actions/download-artifact@v6.0.0
        continue-on-error: true
        with:
          name: pacts
          path: tests/contract/pacts/
      - name: Verify provider contracts (Pact Broker)
        id: contract-broker
        continue-on-error: true
        run: |
          source .venv/bin/activate
          if [ -n "$PACT_BROKER_URL" ]; then
            python -m pytest tests/contract/ -v --tb=short -m integration
          else
            echo "ℹ️  PACT_BROKER_URL not set — skip broker verification"
          fi
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
      - name: Verify provider against local pact files
        if: steps.contract-broker.outcome == 'skipped' || steps.contract-broker.outcome == 'failure'
        run: |
          source .venv/bin/activate
          if [ -d "tests/contract/pacts" ] && ls tests/contract/pacts/*.json 2>/dev/null; then
            PACT_FILE=$(ls tests/contract/pacts/*.json 2>/dev/null | head -1)
            echo "=== Verifying pact: $PACT_FILE ==="
            pact-verifier --provider-base-url http://localhost:8000 \
              --pact-url "$PACT_FILE" \
              --provider-app-version "${{ github.sha }}" \
            || { echo "❌ Pact verification failed against $PACT_FILE"; exit 1; }
          elif [ -n "${{ secrets.PACT_BROKER_URL }}" ]; then
            echo "ℹ️  Broker verification already attempted — see step above"
          else
            echo "ℹ️  No local pact files and no Pact Broker configured — publish consumer pacts first"
          fi
      - name: Upload provider verification results
        uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: provider-verification
          path: |
            tests/contract/pacts/
            /tmp/pact-verification-*.log

  sbom:
    runs-on: docker-x64
    needs: build-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output: sbom.spdx.json
      - name: Verify SBOM (blocking — bad SBOM = broken build)
        run: |
          if [ -f sbom.spdx.json ]; then
            bash scripts/sbom-verify.sh sbom.spdx.json
          else
            echo "❌ SBOM file not generated"
            exit 1
          fi
      - name: Upload SBOM to Dependency-Track (conditional)
        if: env.DTRACK_API_KEY != '' && vars.DTRACK_URL != ''
        env:
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          DTRACK_URL: ${{ vars.DTRACK_URL }}
        run: |
          set -euo pipefail
          echo "📤 Uploading SBOM to Dependency-Track at $DTRACK_URL"
          if ! curl -sf -X POST "${DTRACK_URL}/api/v1/bom" \
               -H "X-Api-Key: ${DTRACK_API_KEY}" \
               -F "projectName=rmi-backend" \
               -F "projectVersion=${GITHUB_SHA::8}" \
               -F "autoCreate=true" \
               -F "bom=@sbom.spdx.json" \
               --retry 2 --retry-delay 5 --max-time 30 > /tmp/dtrack-upload.json 2>&1; then
            echo "⚠️  Dependency-Track upload failed or unreachable (skipping gracefully)"
            cat /tmp/dtrack-upload.json
            exit 0
          fi
          echo "✅ SBOM uploaded to Dependency-Track"
          cat /tmp/dtrack-upload.json
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: sbom
          path: sbom.spdx.json

   # ── SLSA Provenance Constraint (Forgejo vs GitHub Actions) ────────────────
   # Note: The slsa-framework/slsa-github-generator reusable workflow used in
   # .github/workflows/ci.yml requires GitHub Actions OIDC identity (id-token:write)
   # and GitHub Actions reusable workflow syntax, which Forgejo runners do not provide.
   # Therefore, SLSA Build L3 provenance is generated ONLY on the GitHub Actions mirror
   # (see .github/workflows/ci.yml slsa-provenance job). This sign-image job remains
   # unchanged for cosign keyless signing on Forgejo.
   # ────────────────────────────────────────────────────────────────
  sign-image:
    runs-on: docker-x64
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Set up Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "BUILDKIT_PROGRESS=plain" >> $GITHUB_ENV
      - name: Pull build cache
        run: docker pull registry.rugmunch.io/rmi-backend:buildcache || echo "No cache image yet — building from scratch"
      - name: Build Docker image with cache
        run: |
          docker build \
            --cache-from registry.rugmunch.io/rmi-backend:buildcache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t registry.rugmunch.io/rmi-backend:${{ github.sha }} \
            .
      - name: Push cache image
        run: |
          docker tag registry.rugmunch.io/rmi-backend:${{ github.sha }} registry.rugmunch.io/rmi-backend:buildcache
          docker push registry.rugmunch.io/rmi-backend:buildcache
      - name: Push release image
        run: docker push registry.rugmunch.io/rmi-backend:${{ github.sha }}
      - name: Sign image with keyless (OIDC)
        run: |
          cosign sign --yes registry.rugmunch.io/rmi-backend:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity "https://[INTERNAL_HOST]/RugMunchMedia/rmi-backend/.forgejo/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://[INTERNAL_HOST]" \
            registry.rugmunch.io/rmi-backend:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  ocr-review:
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Open Code Review
        run: npm install -g @alibaba-group/open-code-review@latest || echo "OCR install skipped (will retry next run)"
        continue-on-error: true
      - name: Configure OCR
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if command -v ocr &>/dev/null; then
            ocr config set llm.url "$OCR_LLM_URL"
            ocr config set llm.auth_token "$OCR_LLM_AUTH_TOKEN"
            ocr config set llm.model "$OCR_LLM_MODEL"
            ocr config set llm.use_anthropic false
            ocr config set llm.extra_body '{"thinking": {"type": "disabled"}}'
            ocr config set language English
          else
            echo "OCR not installed — skipping config"
          fi
        continue-on-error: true
      - name: Run OCR code review
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
        run: |
          if command -v ocr &>/dev/null; then
            TARGET_BRANCH="${GITHUB_BASE_REF:-main}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            if [ -n "$HEAD_SHA" ]; then
              git fetch origin "$TARGET_BRANCH" 2>/dev/null || true
              ocr review \
                --from "origin/$TARGET_BRANCH" \
                --to "$HEAD_SHA" \
                --format json \
                > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log || echo "OCR review completed with findings"
              echo "=== OCR result ==="
              cat /tmp/ocr-result.json
            else
              echo "Not a PR event — skipping review"
            fi
          else
            echo "OCR not installed — skipping (non-blocking)"
          fi
        continue-on-error: true
      - name: Upload OCR report
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ocr-review-report
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
        continue-on-error: true

  archfit:
    runs-on: docker-x64
    container:
      # node image: checkout@v4 is a node20 action (golang image had no node).
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Go
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://go.dev/dl/go1.22.12.linux-amd64.tar.gz | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Install archfit
        run: go install github.com/alexei-led/archfit/cmd/archfit@latest || echo "archfit install skipped"
        continue-on-error: true
      - name: Run architecture fitness check
        run: |
          if command -v archfit &>/dev/null; then
            archfit analyze
          else
            echo "archfit not installed — skipping (non-blocking)"
          fi

  draugr:
    runs-on: docker-x64
    container:
      # node image: checkout@v4 is a node20 action (golang image had no node).
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Go
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://go.dev/dl/go1.22.12.linux-amd64.tar.gz | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Install Draugr
        run: go install github.com/draugr-dev/draugr@latest || echo "Draugr install skipped"
        continue-on-error: true
      - name: Install scanner tools
        run: |
          if command -v draugr &>/dev/null; then
            draugr tools install || echo "Tool provisioning skipped"
          fi
        continue-on-error: true
      - name: Run supply chain security scan
        run: |
          if command -v draugr &>/dev/null; then
            draugr scan draugr.saga.yaml --fail-on warning --format sarif -o draugr-out/ || echo "Supply chain findings exist"
          else
            echo "Draugr not installed — skipping (use individual scanners instead)"
          fi
        continue-on-error: true
      - name: Upload Draugr SARIF
        uses: actions/upload-artifact@v5.0.0
        with:
          name: draugr-sarif
          path: draugr-out/
        continue-on-error: true

  # ── Gitleaks standalone (blocking) ────────────────────────────
  gitleaks:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      - name: Gitleaks (secrets) — MUST block
        run: gitleaks detect --source . --no-banner --exit-code 1 --config .gitleaks.toml
# Append these jobs under `jobs:` in any repo's ci.yml. Self-contained.
  supply-chain:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
      options: --volume /srv/work/repos/standards:/workspace/RugMunchMedia/standards:ro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (hallucinated/vulnerable deps)
        run: osv-scanner scan source --format table ./ || echo "::warning::OSV findings — triaged baseline, see log"
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --fail --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/latest/download/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"

  nightly-api-fuzz:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Schemathesis property-based API fuzzing (live OpenAPI)
        run: |
          pip install schemathesis
          st run --url "${SCHEMA_URL:-http://rmi-backend:8000/openapi.json}" --checks all --max-examples 50 || echo "::warning::API contract violations found"

  structure-gate:
    # Fleet coding gates (canonical: standards/fleet/gates). BLOCKING ratchets —
    # structure <=200 firm / monkeypatch decrease-only / antipattern per-repo /
    # gate self-test. Baselines: scripts/{structure,monkeypatch,antipattern}-baseline.json.
    # Shrink freely; growth or NEW offenders fail the build. Regenerate deliberately
    # (--update-baseline); sync the toolkit with fleet-sync-gates.sh.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Structure gate (<=200 firm, shrink-only allowlist)
        run: python3 scripts/check-structure.py --repo . --scan-root app --scan-root src
      - name: Monkeypatch ratchet (decrease-only)
        run: python3 scripts/check-monkeypatch.py --repo .
      - name: Antipattern ratchet (per-repo baseline)
        run: python3 scripts/check-antipatterns.py --repo .
      - name: Gate self-test (proves each gate catches its violation class)
        run: bash scripts/ci-gate-selftest.sh
