name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # k6 smoke tests run against live deployment every 6 hours
    - cron: '0 */6 * * *'

# PRs MUST pass all CI jobs before merge
# Coverage thresholds below enforce quality gates

env:
  COVERAGE_THRESHOLD: 70
  PYTHON_VERSION: "3.11"
  # CI-only dummy (>=32 chars): app Settings validation requires a secure
  # JWT secret; CI never exercises real tokens with it.
  JWT_SECRET: ci-dummy-jwt-secret-not-used-in-production-0000
  # HS256 for CI: RS256 requires real key material (JWT_PRIVATE_KEY /
  # JWT_PUBLIC_KEY) which CI must not hold; routers mount fine with HS256.
  JWT_ALGORITHM: HS256

jobs:
  test-oracle-tautology:
    # AI-TEST-ORACLE-POLICY advisory gate: flags tests that assert nothing
    # (no asserts, negative-status-only, truthy-only). Advisory until the
    # current 238-finding backlog is burned down, then flip to blocking.
    continue-on-error: true
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tautology scan (advisory)
        run: |
          python3 scripts/tautology-detector.py tests/ --json > tautology-report.json || true
          python3 scripts/tautology-detector.py tests/ || true
      - name: Store report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tautology-report
          path: tautology-report.json


  pre-commit-mirror:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
      options: --volume /srv/work/repos/standards:/workspace/RugMunchMedia/standards:ro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + pre-commit + hook tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl gcc libpq-dev
          rm -rf /var/lib/apt/lists/*
          pip install pre-commit ruff mypy pytest
          # App deps: the pytest/mypy hooks analyze real modules.
          pip install -e .
      - name: Run ALL pre-commit hooks on all files
        run: |
          # Skip: local-only + dedicated-job hooks (see job comment).
          SKIP=no-commit-to-branch,ruff,ruff-format,mypy,pytest,squawk pre-commit run --all-files --show-diff-on-failure

  commitlint:
    runs-on: docker-x64
    container:
      # full bookworm (not -slim): commitlint shells out to git, slim lacks it
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Need full history to check all commits in PR
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Check all commits in the PR
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            # On push to main, just check the latest commit
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  changelog-check:
    # git-cliff gate: on tagged releases, verify a non-empty changelog can be
    # generated from conventional commits. Operates on a temp file so the
    # committed CHANGELOG.md (curated) is never clobbered by CI.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: docker-x64
    container:
      image: localhost/ci-alpine-node:3.19
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Need tags for git-cliff version detection
      - name: Install git-cliff
        run: |
          apk add --no-cache curl tar
          # musl build — the container is alpine (musl libc); the gnu build
          # fails with "not found" (loader mismatch).
          curl -fsSL https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-musl.tar.gz -o /tmp/git-cliff.tar.gz
          tar xzf /tmp/git-cliff.tar.gz -C /usr/local/bin --strip-components=1 git-cliff-2.13.1/git-cliff
          git-cliff --version
      - name: Generate changelog (to temp file) and verify non-empty
        run: |
          git-cliff --config cliff.toml --output /tmp/CHANGELOG.generated.md
          if [ ! -s /tmp/CHANGELOG.generated.md ]; then
            echo "❌ git-cliff produced an empty changelog for tag ${{ github.ref_name }}"
            exit 1
          fi
          echo "✅ Changelog generated ($(wc -l < /tmp/CHANGELOG.generated.md) lines)"
          head -40 /tmp/CHANGELOG.generated.md

  semgrep:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep SAST scan (community rules)
        # BLOCKING — findings triaged 2026-09-05. Exclusions live in
        # .semgrep/exclude-rules.txt (58x parameterized ClickHouse text(),
        # 2x avoid-sqlalchemy-text parameterized where_clause, 2x ws://
        # docstring/rewrite literals, 1x nan-injection FP annotated inline
        # with nosemgrep). Re-triage before removing any exclusion.
        run: |
          EXCLUDE_RULES=$(grep -v '^#' .semgrep/exclude-rules.txt | grep -v '^$' | sed 's/^/--exclude-rule=/' | tr '\n' ' ')
          semgrep scan --config=auto \
            --severity=ERROR \
            $EXCLUDE_RULES \
            --error \
            --exclude='tests/' \
            --exclude='alembic/' \
            --exclude='app/_archive/' \
            --exclude='app/legacy/' \
            --sarif \
            --output=semgrep.sarif \
            app/
          echo "semgrep findings: $(python3 -c "import json;print(len(json.load(open('semgrep.sarif'))['runs'][0]['results']))" 2>/dev/null || echo '?') (blocking — see comment above)"
      - uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif

  aiverify:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install aiverify
        run: pip install aiverify-cli 2>/dev/null || echo "aiverify install skipped"
        continue-on-error: true
      - name: Detect AI hallucinations
        run: |
          if command -v aiverify &>/dev/null; then
            aiverify app/ --json || echo "AI-specific issues found — review needed"
          else
            echo "aiverify not installed — skipping"
          fi
        continue-on-error: true
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: aiverify-report
          path: aiverify-output.json
        continue-on-error: true

  squawk:
    # Squawk lints PostgreSQL migration SQL files (*.sql). Current migrations
    # are Alembic Python (.py) files, so there are no .sql files to lint yet.
    # The gate will activate when .sql migration files are added to
    # alembic/versions/ or migrations/ directories.
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Squawk
        run: npm install -g squawk-cli
      - name: Lint Postgres migrations
        run: |
          SQL_FILES=$(find alembic/versions migrations -name "*.sql" 2>/dev/null || true)
          if [ -n "$SQL_FILES" ]; then
            COUNT=$(echo "$SQL_FILES" | wc -l)
            echo "=== Squawk: linting $COUNT SQL migration file(s) ==="
            echo "$SQL_FILES" | xargs squawk || echo "Squawk found issues — review migration files"
          else
            PY_COUNT=$(find alembic/versions -name "*.py" 2>/dev/null | wc -l)
            echo "No SQL migration files found ($PY_COUNT Python Alembic files present)."
            echo "Gate will activate when .sql migration files are added."
          fi
      - name: Migration file inventory
        run: |
          echo "=== Migration File Inventory ==="
          PY_COUNT=$(find alembic/versions -name "*.py" 2>/dev/null | wc -l)
          SQL_COUNT=$(find alembic/versions -name "*.sql" 2>/dev/null | wc -l)
          echo "  Python (Alembic): $PY_COUNT files"
          echo "  SQL (Squawk):     $SQL_COUNT files"
          if [ -d "migrations" ]; then
            MIG_SQL=$(find migrations -name "*.sql" 2>/dev/null | wc -l)
            echo "  SQL (migrations/): $MIG_SQL files"
          fi

  sql-lint:
    # sqlfluff SQL lint gate. Root .sqlfluff defaults to postgres; per-dir
    # .sqlfluff overrides set clickhouse for app/db/clickhouse_migrations/
    # and infra/. .sqlfluffignore excludes the ClickHouse TTL file whose
    # MODIFY TTL ... DELETE syntax the clickhouse dialect cannot parse yet.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install sqlfluff
        run: pip install sqlfluff==4.3.0
      - name: Lint SQL files (structural rules)
        run: |
          sqlfluff lint . --nocolor
      - name: Report linted files
        run: |
          SQL_FILES=$(find . -name "*.sql" -not -path "./.venv/*" -not -path "./.git/*" 2>/dev/null)
          echo "=== SQL files in repo: $(echo "$SQL_FILES" | grep -c . ) ==="
          echo "$SQL_FILES"

  api-lint:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates nodejs npm && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli
      - name: Export OpenAPI schema
        run: |
          source .venv/bin/activate
          python -c "
          import json, sys
          sys.path.insert(0, '.')
          from app.main import app
          schema = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2)
          "
      - name: Lint OpenAPI with Spectral (ratchet — no NEW errors)
        # Baseline stored in spectral-baseline.txt (updated on successful runs).
        # Blocks REGRESSIONS only — burn down and lower baseline over time.
        run: |
          spectral lint openapi.json --ruleset .spectral.yaml -f json -o spectral.json || true
          COUNT=$(python3 -c "import json; d=json.load(open('spectral.json')); print(sum(1 for r in d if r.get('severity')==0))" 2>/dev/null || echo 0)
          echo "spectral errors: $COUNT (baseline: $(cat spectral-baseline.txt))"
          BASELINE=$(cat spectral-baseline.txt); if [ "$COUNT" -gt "$BASELINE" ]; then echo "❌ New spectral errors"; exit 1; fi
          echo "✅ No new spectral errors"
          # Update baseline on success (ratchet down)
          echo "$COUNT" > spectral-baseline.txt
          echo "Updated baseline to $COUNT"
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: openapi-schema
          path: openapi.json

  oasdiff:
    # Detects BREAKING OpenAPI changes introduced by a PR.
    # Compares PR HEAD against the LAST RELEASE TAG (v1.0.0) — a stable,
    # reproducible baseline. The current-venv-running-old-code approach is
    # fragile; release tags are immutable and have known-good dependencies.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install system deps + uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.11.7/oasdiff_1.11.7_linux_amd64.tar.gz -o /tmp/oasdiff.tar.gz
          tar xzf /tmp/oasdiff.tar.gz -C /usr/local/bin oasdiff
          oasdiff --version
      - name: Generate OpenAPI from app (PR head)
        run: |
          source .venv/bin/activate
          python -c "
          import json, sys
          sys.path.insert(0, '.')
          from app.main import app
          schema = app.openapi()
          with open('openapi.json', 'w') as f:
              json.dump(schema, f, indent=2)
          "
          cp openapi.json /tmp/openapi-head.json
      - name: Generate OpenAPI from app (last release tag v1.0.0)
        run: |
          LAST_RELEASE="v1.0.0"
          git fetch origin "$LAST_RELEASE" 2>/dev/null || true
          mkdir -p /tmp/rmi-release
          git archive "$LAST_RELEASE" | tar -x -C /tmp/rmi-release
          echo "Release tag: $LAST_RELEASE"
      - name: Generate OpenAPI from release tag
        run: |
          cd /tmp/rmi-release
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "
          import json, sys
          sys.path.insert(0, '.')
          from app.main import app
          schema = app.openapi()
          with open('/tmp/openapi-base.json', 'w') as f:
              json.dump(schema, f, indent=2)
          " || {
            echo "::warning::Failed to generate OpenAPI from $LAST_RELEASE (deps incompatible) — skipping diff"
            exit 0
          }
      - name: Detect breaking OpenAPI changes
        run: |
          # Skip cleanly when the base spec is missing or invalid.
          if [ ! -s /tmp/openapi-base.json ] || ! python3 -c "import json; d=json.load(open('/tmp/openapi-base.json')); assert isinstance(d, dict) and 'openapi' in d" 2>/dev/null; then
            echo "Base spec missing/invalid — skipping breaking-change diff."
            exit 0
          fi
          # oasdiff cannot parse OpenAPI 3.1 (numeric exclusiveMinimum etc.;
          # its Go schema expects 3.0-style bool). A parser failure is a tool
          # limitation, not a breaking change — warn and skip; real diffs still
          # fail the gate.
          OUT=$(oasdiff breaking /tmp/openapi-base.json /tmp/openapi-head.json --fail-on ERR -f githubactions 2>&1) && STATUS=0 || STATUS=$?
          if echo "$OUT" | grep -qE "failed to load|cannot unmarshal|failed to unmarshal"; then
            echo "::warning::oasdiff cannot parse this OpenAPI 3.1 spec (known limitation) — gate skipped"
            exit 0
          fi
          echo "$OUT"
          exit $STATUS

  import-linter:
    # Enforces architectural layer contracts declared in .importlinter:
    #   1. app.core never imports app.api (layers)
    #   2. app.services never imports app.api/app.routers (forbidden)
    #   3. app.adapters are leaf modules (forbidden)
    # Static analysis only — no application code is imported.
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install import-linter
        run: pip install import-linter
      - name: Enforce architectural contracts
        run: lint-imports --config .importlinter

  bandit:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install bandit
        run: pip install bandit
      - name: Bandit SAST scan (ratchet, baseline 47)
        # B608 SQL-string warnings (40) are the bulk — mostly constant-built
        # SQL; triage before tightening. Blocks REGRESSIONS meanwhile.
        run: |
          COUNT=$(bandit -r app/ -ll -q -f json 2>/dev/null | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('results',[])))" || echo 0)
          bandit -r app/ -ll -f json -o bandit-report.json || true
          echo "bandit MEDIUM+ findings: $COUNT (baseline: 47)"
          if [ "$COUNT" -gt 47 ]; then echo "❌ New bandit findings"; exit 1; fi
          echo "✅ No new bandit findings"
      - name: Upload report
        uses: actions/upload-artifact@v5.0.0
        with:
          name: bandit-report
          path: bandit-report.json

  shellcheck:
    runs-on: docker-x64
    container:
      # node image: checkout@v4 is a node20 action (shellcheck image had no node).
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates xz-utils && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar xJ -C /tmp
          mv /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/
      - name: ShellCheck (ratchet, baseline 31)
        run: |
          COUNT=$(find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/sdks/*" -exec shellcheck -x {} + 2>&1 | grep -cE "SC[0-9]+" || true)
          echo "shellcheck findings: $COUNT (baseline: 31)"
          if [ "$COUNT" -gt 31 ]; then echo "❌ New shellcheck findings"; exit 1; fi
          echo "✅ No new shellcheck findings"
      - name: Bash Syntax
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.venv/*" -not -path "*/sdks/*" -exec bash -n {} \;

  docker-lint:
    # hadolint gate: lints the root Dockerfile for best-practice violations.
    # node image + binary: checkout@v4 is a node20 action (the hadolint
    # image has no node, so the job died at checkout).
    runs-on: docker-x64
    container:
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install hadolint
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint && chmod +x /usr/local/bin/hadolint
      - name: Hadolint Dockerfile
        run: hadolint Dockerfile

  layerlint:
    runs-on: docker-x64
    container:
      # localhost/ci-alpine-node:3.19 does not exist on this runner; node
      # image also satisfies checkout@v4's node20 requirement.
      image: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install layerLint
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSL https://github.com/vviveksharma/layerLint/releases/download/v1.0.1/layerLint_1.0.1_Linux_x86_64.tar.gz | tar xz -C /usr/local/bin
          chmod +x /usr/local/bin/layerlint
      - name: Lint Dockerfiles for caching issues
        run: |
          find . -name "Dockerfile*" -not -path "*/node_modules/*" -not -path "*/.venv/*" | while read -r dockerfile; do
            echo "=== $dockerfile ==="
            layerlint scan --dockerfile "$dockerfile" --fail-on-severity high || echo "Caching issues found in $dockerfile"
          done
        continue-on-error: true

  build-and-test:
    runs-on: docker-x64
    container:
      # Needs node for actions/checkout (node20 runtime) AND python 3.11.
      # python:3.11-slim has no node -> "exec: node: not found" in checkout
      # post-step. Keep in sync with env.PYTHON_VERSION below.
      image: nikolaik/python-nodejs:python3.11-nodejs22
      options: --volume /srv/work/repos/standards:/workspace/RugMunchMedia/standards:ro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        # No pinned checksum: the installer's own digest verification covers
        # the binary, and a stale pin breaks whenever astral.sh updates the
        # script (this job had been failing on a checksum mismatch).
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Python
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv venv --python ${{ env.PYTHON_VERSION }} .venv

      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint (ruff)
        run: |
          source .venv/bin/activate
          COUNT=$(ruff check . 2>&1 | grep -oE "Found [0-9]+ errors" | grep -oE "[0-9]+" || echo 0)
          echo "ruff errors: $COUNT (baseline: 281)"
          if [ "$COUNT" -gt 281 ]; then echo "❌ New lint errors"; exit 1; fi
          echo "✅ No new lint errors"

      - name: Format check (ruff)
        run: |
          source .venv/bin/activate
          COUNT=$(ruff format --check . 2>&1 | grep -oE "[0-9]+ files would be reformatted" | grep -oE "[0-9]+" || echo 0)
          echo "unformatted files: $COUNT (baseline: 61)"
          if [ "$COUNT" -gt 61 ]; then echo "❌ New unformatted files"; exit 1; fi
          echo "✅ No new formatting debt"

      - name: Type check (mypy)
        run: |
          source .venv/bin/activate
          COUNT=$(mypy app/ --ignore-missing-imports 2>&1 | grep -cE "error:" || true)
          echo "mypy errors: $COUNT (baseline: 319)"
          if [ "$COUNT" -gt 319 ]; then echo "❌ New type errors"; exit 1; fi
          echo "✅ No new type errors"

      - name: Run unit tests with coverage
        # Coverage floor: 60% (matches pyproject.toml [tool.coverage.report] fail_under)
        # Tests MUST pass — blocks the pipeline on failure or insufficient coverage
        run: |
          source .venv/bin/activate
          pytest tests/ -x -q --tb=short -m "not integration and not benchmark" -n 4 --max-worker-restart=3 --dist=loadfile \
            --cov=app \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=lcov:coverage.lcov \
            --cov-fail-under=60

      - name: Check coverage threshold
        run: |
          source .venv/bin/activate
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0))
          print(f'Coverage: {line_rate*100:.1f}%')
          if line_rate < 0.60:
              print('❌ Coverage below 60% threshold')
              exit(1)
          print('✅ Coverage threshold met')
          "

      - name: Run E2E tests
        run: |
          source .venv/bin/activate
          pytest tests/e2e/ -x -q --tb=short \
            --cov=app \
            --cov-report=term \
            --cov-report=xml:coverage-e2e.xml \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} || echo "E2E tests noted (non-blocking for coverage)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: unittests
          name: rmi-backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v5.0.0
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.lcov

  migration-test:
    runs-on: docker-x64
    needs: build-and-test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rmi_test_migrations
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install alembic sqlalchemy psycopg2-binary
          pip install -r requirements.txt 2>/dev/null || true
      - name: Apply all migrations
        run: |
          export ALEMBIC_DATABASE_URL=postgresql://postgres:test@postgres:5432/rmi_test_migrations
          alembic upgrade head && echo "✅ All migrations applied cleanly" || { echo "❌ Migration apply failed"; exit 1; }
      - name: Verify migration history
        run: |
          export ALEMBIC_DATABASE_URL=postgresql://postgres:test@postgres:5432/rmi_test_migrations
          CURRENT=$(alembic current 2>/dev/null | head -1)
          echo "  Current revision: $CURRENT"
          HEAD=$(alembic heads | head -1)
          echo "  Head revision:    $HEAD"
          if [ "$CURRENT" = "$HEAD" ]; then
            echo "✅ At head revision"
          else
            echo "❌ Not at head ($CURRENT vs $HEAD)"
            exit 1
          fi
      - name: Rollback and re-apply
        run: |
          export ALEMBIC_DATABASE_URL=postgresql://postgres:test@postgres:5432/rmi_test_migrations
          # Downgrade one revision (informational — some migrations lack downgrade)
          if alembic downgrade -1 2>/dev/null; then
            echo "✅ Rollback successful"
            # Re-apply after rollback
            alembic upgrade head && echo "✅ Re-apply successful after rollback" || { echo "❌ Re-apply failed"; exit 1; }
          else
            echo "⚠️  Rollback skipped (migration lacks downgrade path)"
          fi

  deps-freshness:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    needs: build-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check dependency freshness
        run: |
          pip install libyear 2>/dev/null || true
          if [ -f requirements.txt ]; then
            pip install pip-tools && libyear --file requirements.txt || echo "Dep freshness check noted"
          fi
        continue-on-error: true

  k6-smoke:
    # k6 needs a RUNNING backend to test against. In PR CI the full Docker
    # Compose stack (Postgres + Redis + ClickHouse + app) would be required,
    # and secrets (DATABASE_PASSWORD, REDIS_PASSWORD, etc.) are not available
    # in PR context. Runs on schedule against the live deployment instead.
    # To enable: set K6_TARGET_URL as a repo variable (vars) or secret
    # pointing to the deployed API (e.g., https://api.rugmunch.io).
    #
    # Non-blocking (continue-on-error) until the API is available in CI.
    # Graduate to blocking by removing continue-on-error once a test
    # environment is provisioned (e.g., ephemeral Docker Compose stack).
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: docker-x64
    container:
      # Standard python+node image: actions/checkout is a node action and
      # cannot run inside grafana/k6 (no node -> exitcode 127). k6 itself
      # is installed below from the official static binary (v2.2.0).
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install k6
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -sSL -o /tmp/k6.tar.gz \
            https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          mv /tmp/k6-v2.2.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: Create results directory
        run: mkdir -p tests/k6/results
      - name: Connectivity pre-check
        run: |
          echo "🔍 Checking API reachability at ${{ vars.K6_TARGET_URL || 'https://api.rugmunch.io' }} ..."
          curl -sSf -o /dev/null -w "HTTP %{http_code}\n" \
            "${{ vars.K6_TARGET_URL || 'https://api.rugmunch.io' }}/health" \
            --connect-timeout 10 --max-time 15 \
            && echo "✅ API is reachable — proceeding with k6 smoke test" \
            || echo "⚠️  API not reachable — k6 will report failures (non-blocking)"
        continue-on-error: true
      - name: Run k6 smoke test against live deployment
        run: |
          k6 run tests/k6/smoke.js \
            -e BASE_URL=${{ vars.K6_TARGET_URL || 'https://api.rugmunch.io' }} \
            --summary-export=tests/k6/results/smoke-summary.json
      - uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: k6-smoke-report
          path: tests/k6/results/

  mutation-test:
    runs-on: docker-x64
    needs: build-and-test
    continue-on-error: true  # informational only for now
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + uv
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python -e ".[dev]" mutmut
      - name: Mutation testing (scoped to app/core)
        run: source .venv/bin/activate && mutmut run --paths-to-mutate app/core/ --test-timeout 10 || echo "Mutation score noted (non-blocking)"
      - uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: mutation-report
          path: |
            .mutmut-cache/
            html/
          include-hidden-files: true

  crucible-gate:
    runs-on: docker-x64
    needs: build-and-test
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system deps + uv + mutmut
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libpq-dev curl git ca-certificates
          rm -rf /var/lib/apt/lists/*
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv python install 3.11 && uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python mutmut
          # Install crucible if available
          pip install crucible-harden 2>/dev/null || echo "Crucible not on PyPI yet — gate runs mutmut directly"
      - name: Crucible mutation gate (score only, no AI)
        run: |
          source .venv/bin/activate
          if command -v crucible &>/dev/null; then
            crucible score . --module app/core || echo "Crucible gate noted"
          else
            # Fallback: run mutmut directly for the mutation gate
            mutmut run --paths-to-mutate app/core/ 2>/dev/null && mutmut results || echo "Mutation gate noted (non-blocking)"
          fi
        continue-on-error: true

  slow-tests:
    runs-on: docker-x64
    needs: build-and-test
