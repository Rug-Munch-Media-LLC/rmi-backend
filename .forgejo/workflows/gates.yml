name: Gates

# Rollout of the fleet reusable gate set (standards/.forgejo/workflows/reusable-ci.yml).
# ci.yml already gates lint, mypy, pytest, semgrep, structure and pre-commit
# (incl. gitleaks). The one missing gate is dependency/OSV scanning, so it is
# enabled here and nothing existing is disabled or relaxed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reusable:
    uses: RugMunchMedia/standards/.forgejo/workflows/reusable-ci.yml@main
    with:
      language: python
      enable_lint: "false"
      enable_typecheck: "false"
      enable_test: "false"
      enable_secret_scan: "false"
      enable_sast: "false"
      enable_structure: "false"
      enable_deps: "true"
