extends:
  - "spectral:oas"
  - "spectral:asyncapi"

rules:
  # ── Security ──────────────────────────────────────────
  oas3-api-servers: error
  openapi-tags: warn
  operation-tags: error
  operation-operationId: warn

  # ── Naming conventions ────────────────────────────────
  path-kebab-case:
    description: "Paths should use kebab-case"
    message: "{{property}} should be kebab-case (lowercase and hyphens)"
    severity: warn
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^(\/[a-z0-9-]+|\/{[a-zA-Z0-9_]+})+$"

  # ── Prevent breaking changes ──────────────────────────
  no-http-basic:
    description: "HTTP Basic authentication is not allowed"
    message: "Use Bearer/JWT auth instead of HTTP Basic"
    severity: error
    given: "$.components.securitySchemes[*]"
    then:
      field: scheme
      function: pattern
      functionOptions:
        notMatch: "^basic$"

  # ── Responses ─────────────────────────────────────────
  # NOTE: the custom override was REMOVED 2026-10-10. As written it pattern-matched
  # EVERY response key (flagging each 4xx/5xx entry — 650+ false errors), not the
  # operation's success response. The built-in `spectral:oas` rule with the same
  # name enforces "at least one 2xx response" correctly.

  # ── Schema quality ────────────────────────────────────
  schema-description:
    description: "All schemas must have descriptions"
    message: "{{property}} is missing a description"
    severity: warn
    given: "$.components.schemas[*]"
    then:
      field: description
      function: truthy

  # ── Pagination ────────────────────────────────────────
  pagination-style:
    description: "Collection endpoints should accept pagination params"
    severity: warn
    given: "$.paths[*].get.parameters[?(@.name=='offset' || @.name=='limit')]"
    then:
      function: truthy
