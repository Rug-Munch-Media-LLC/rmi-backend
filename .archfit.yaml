# Generated by archfit init — TODO: review and promote gate: warn to gate: fail
version: 1

# Balanced-Coupling advisory tuning.
coupling:
  # Minimum severity for a coupling advisory: low|medium|high|critical
  min_severity: medium
  # Clone-only duplicated knowledge: score|advisory (default score)
  duplicated_knowledge: score

languages:
  go:
    enabled: false
  python:
    enabled: true
    package: app
  typescript:
    enabled: false
  rust:
    enabled: false

# Optional analyzers (deeper facts; opt in deliberately because they can be slow).
# analyzers:
#   scip: { enabled: true }         # symbol-level coupling strength
#   syntax: { enabled: true }       # ast-grep: roles, routes, exported surface
#   clones: { enabled: true }       # cross-module duplication

# Off-gate LLM for `config init/update/enrich`, `analyze --ai-summary`, and `explain --ai-summary` (never used by the deterministic gate).
# ai:
#   provider: anthropic   # anthropic | openai | ollama
#   model: claude-opus-4-8
#   base_url: ""          # ollama only

