# SpiderFoot — self-hosted OSINT automation engine
# =================================================
# General OSINT for rug/scam investigations: target (domain / email /
# username / wallet / IP) in -> 100+ passive/active modules out, unified via
# the JSON web API (POST /startscan, GET /scanstatus, GET /scaneventresults,
# GET /scanerrors) consumed by app/osint/spiderfoot_client.py.
#
# Image: built from the pinned v4.0.0 source tag (see Dockerfile). There is
# no official `spiderfoot/spiderfoot` image on Docker Hub; we build from the
# upstream Dockerfile pinned to v4.0.0 for reproducibility + auditability.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --build --wait
#   open http://127.0.0.1:5001   (web UI)
#   .venv/bin/python -c "from app.osint.spiderfoot_client import lookup; r=lookup('example.com'); print(r.found, r.errors)"
#
# Docs: https://github.com/smicallef/spiderfoot (Dockerfile + sfwebui.py API)

services:
  spiderfoot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SF_VERSION: ${SPIDERFOOT_VERSION:-v4.0.0}
    image: rmi-spiderfoot:${SPIDERFOOT_VERSION:-v4.0.0}
    container_name: rmi-spiderfoot
    restart: unless-stopped
    # Loopback-only by default (OSINT tool, no public exposure).
    # For remote access use SSH tunnel or `tailscale serve` (see README).
    ports:
      - "127.0.0.1:${SPIDERFOOT_PORT:-5001}:5001"
    volumes:
      # Entire SpiderFoot DB (scan results, module config, cache).
      # Back this directory up — it is the investigation state.
      - spiderfoot-data:/var/lib/spiderfoot
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
          pids: 2048
    healthcheck:
      # /ping answers 200 once the web server (with the JSON API) is up.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5001/ping', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  spiderfoot-data:
