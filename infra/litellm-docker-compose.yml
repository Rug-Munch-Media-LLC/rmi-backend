
# LiteLLM — sovereign LLM router
# Using Docker secrets for API keys (loaded by entrypoint wrapper)
# Secrets stored in /srv/secrets/ on Talos
# See fleet-infra/rmi-infra/litellm-docker-compose.yml for deployed version

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: rmi-litellm
    network_mode: host
    dns:
      - 127.0.0.53
    entrypoint: ["/srv/rmi-infra/docker-entrypoint-wrapper.sh", "docker/prod_entrypoint.sh"]
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "127.0.0.1", "--num_workers", "1"]
    secrets:
      - litellm_master_key
      - deepseek_api_key
      - openrouter_api_key
      - groq_api_key
      - mistral_api_key
      - kimi_api_key
    environment:
      # LITELLM_MASTER_KEY and provider API keys are loaded from
      # Docker secrets by the entrypoint wrapper
      - SERVICE_NAME=rmi-litellm
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - litellm-data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3

secrets:
  litellm_master_key:
    file: /srv/secrets/litellm_master_key
  deepseek_api_key:
    file: /srv/secrets/deepseek_api_key
  openrouter_api_key:
    file: /srv/secrets/openrouter_api_key
  groq_api_key:
    file: /srv/secrets/groq_api_key
  mistral_api_key:
    file: /srv/secrets/mistral_api_key
  kimi_api_key:
    file: /srv/secrets/kimi_api_key

volumes:
  litellm-data:
