[mypy]
strict = true
plugins = pydantic.mypy
ignore_missing_imports = true
# Pragmatic: tolerate the historical missing-annotation debt while still
# catching REAL type errors (arg-type, union-attr, attr-defined, assignment,
# index, return-value). New code should be fully typed; these four codes are
# the pre-strict backlog.
disable_error_code = no-untyped-def, no-any-return, no-untyped-call, var-annotated
exclude = (\.venv/|tests/|__pycache__/)

# FastMCP (fastmcp) ships without type stubs — its @mcp.tool()/@mcp.resource()
# decorators are untyped, making every decorated function "untyped". Scoped to
# the MCP server entrypoints only; the rest of the databus layer stays strict.
[mypy-app.databus.x402_mcp_server,app.databus.news_mcp_server]
disallow_untyped_decorators = False


