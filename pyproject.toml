[project]
name = "rmi-backend"
version = "0.1.0"
description = "RMI (Rug Munch Intelligence) crypto-scam detection backend"
requires-python = ">=3.11"
readme = "DESIGN.md"

# Pinned versions are kept in requirements.txt for the Docker build.
# This pyproject.toml defines tool config (ruff/mypy/pytest) and a thin
# dependency list. `pip install -e .` works in dev; production uses
# `pip install -r requirements.txt`.
dependencies = [
    # Canonical scanner engine (PRIVATE methodology repo). Thin adapters under
    # app/scoring/* re-export from here; the scanner is the single source of truth.
    # Requires forgejo auth (same trust boundary as this repo).
    #
    # ── PINNED TO AN IMMUTABLE COMMIT SHA — DO NOT "SIMPLIFY" THIS TO A TAG ──
    # WHY A SHA AND NOT A TAG (or a bare branch):
    #   A tag is a MUTABLE pointer. Anyone can `git tag -f v0.2.0 <new-sha>` and
    #   every build afterwards silently installs different code under the same
    #   name. A branch name is worse: it moves on every merge, so a rebuilt image
    #   picks up unreviewed commits with no diff in this file. Only a 40-hex
    #   commit SHA is content-addressed and can never be rewritten. Pinning the
    #   SHA is what makes "which commit is the running backend built from?" and
    #   "roll back to the last good one" answerable at all.
    #   If you are tempted to swap this for `@v0.2.0` to "make upgrades easier",
    #   you have just deleted the rollback target. The upgrade procedure that
    #   makes a tag unnecessary lives in docs/DEPENDENCY-PINNING.md.
    #
    # TO MOVE THE PIN FORWARD (the ONE place to change it — this line):
    #   1. git -C <scanner-repo> log --oneline -20
    #   2. pick the scanner commit you have actually reviewed/tested
    #   3. replace the @<40-hex-sha> below
    #   4. verify:  uv lock --dry-run   (read-only check, writes no lockfile)
    #   5. update the table in docs/DEPENDENCY-PINNING.md
    #   6. commit as:  fix(deps): pin rugmunch-scanner to <short-sha>
    "rugmunch-scanner @ git+https://git.rugmunch.io/RugMunchMedia/rugmunch-scanner.git@70be4090e47eebe8ab5ad999a5959e532ffd96c6",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "qdrant-client>=1.18.0",  # Official Qdrant client (RugMaps Phase 0, RAG)
    "structlog>=24.4.0",
    "langfuse>=3.0.0",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.17",
    "duckdb>=0.10.0",
    "tiktoken>=0.7.0",  # RAG chunking token counting (falls back to heuristic if absent)
    "telethon>=1.35.0",  # MTProto user-session client for headless Telegram reads (app/domains/telegram/headless_client.py)
    "langgraph>=1.0.0",  # Agentic RAG orchestration (app/rag/graph.py)
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "pydantic-ai-slim[openai]>=2.27.0",  # Pydantic AI agent framework (app/agents); openai extra required by OpenAIChatModel
    # Exact pins (dev: pip install -e .; Docker build uses requirements.txt)
    "scalar-fastapi==1.9.1",  # Scalar OpenAPI docs UI for FastAPI
    "pyrevm==0.3.7",  # EVM runtime for contract simulation
    "eth-utils==6.0.0",  # Ethereum utilities — pinned explicitly (transitive via eth-account)
    "heimdall-py==0.9.11",  # Heimdall EVM bytecode decompiler (unverified-contract ABI extraction)
    "pyod==3.6.7",  # PyOD anomaly detection ensemble (app/pyod_anomaly.py)
    "dnspython==2.9.0",  # DNS lookups (app/osint/domain.py)
    "python-whois==0.9.6",  # WHOIS lookups (app/osint/domain.py)
    "phonenumbers==9.0.41",  # phone validation/carrier (app/osint/phone.py)
    "rapidocr-onnxruntime==1.4.4",  # OCR (app/ocr_utils.py)
    # Merged from requirements.txt (2026-09-05) — pyproject.toml is now the
    # single source of truth; requirements.txt is just `-e .`.
    "uvicorn[standard]>=0.32.0",
    "rapidfuzz>=3.14.0",
    "python-telegram-bot[job-queue]>=21.0",
    "pillow>=10.0.0",
    "supabase>=2.0.0",
    "python-jose[cryptography]>=3.3.1",
    "aiohttp>=3.14.3",  # transitive-vuln floor: PYSEC-2026-3545/3546/3547
    "feedparser>=6.0.11",
