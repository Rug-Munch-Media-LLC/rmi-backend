[project]
name = "rmi-backend"
version = "0.1.0"
description = "RMI (Rug Munch Intelligence) crypto-scam detection backend"
requires-python = ">=3.11"
readme = "DESIGN.md"

# Pinned versions are kept in requirements.txt for the Docker build.
# This pyproject.toml defines tool config (ruff/mypy/pytest) and a thin
# dependency list. `pip install -e .` works in dev; production uses
# `pip install -r requirements.txt`.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "qdrant-client>=1.18.0",  # Official Qdrant client (RugMaps Phase 0, RAG)
    "structlog>=24.4.0",
    "langfuse>=3.0.0",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.17",
    "duckdb>=0.10.0",
    "tiktoken>=0.7.0",  # RAG chunking token counting (falls back to heuristic if absent)
    "langgraph>=1.0.0",  # Agentic RAG orchestration (app/rag/graph.py)
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "pydantic-ai-slim>=2.0.0",  # Pydantic AI agent framework (app/agents)
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.46b0",
]


dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.0.0",
    # gitleaks is a Go binary installed via lefthook/system, not pip — excluded
    # from dev extras so `uv lock` can resolve the dependency graph.
    "mutmut>=3.0.0",
    "hypothesis>=6.0.0",
    "pact-python>=2.0.0",
    "vulture>=2.16",
    "radon>=6.0",
    "interrogate>=1.7",
    "deptry>=0.25",
    "pip-audit>=2.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Declare app/ as an installable package so `pip install -e ".[dev]"` registers
# it on sys.path. Without this, pytest collection fails outside the repo cwd
# (33/35 test files fail without PYTHONPATH=.).
# packages.find auto-discovers every sub-package that has __init__.py.
# Sub-packages without __init__.py are namespace packages and remain out of
# scope for Phase 1.3 (tracked for Phase 3).
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["app._archive*", "app._archive.**"]
namespaces = false

[tool.ruff]
extend = "../standards/templates/ruff-base.toml"
line-length = 120
extend-exclude = [
    "_legacy_main.py",
    "app/legacy/",
    "app/_archive/",
    "alembic/versions/",
    "build/",
    "dist/",
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to be looser
"tests/**/*.py" = ["S101", "S105", "S106", "B011"]
# Legacy code excluded entirely
"_legacy_main.py" = ["ALL"]
"app/legacy/**" = ["ALL"]
# FAISS migration script: pickles are our own artifacts (models bundled in Docker),
# same trust model as app/ann_index.py
"scripts/migrate_faiss_to_qdrant.py" = ["S301"]
# Telegram bot: pre-existing try/except/pass patterns, non-crypto random
"app/domains/telegram/rugmunchbot/bot.py" = ["S110", "S311"]
# Bot admin state: best-effort config fallbacks (Redis down / import guard) — fail open is intentional
"app/domains/telegram/rugmunchbot/admin_state.py" = ["S110"]
# Bot admin API: trusted internal SQL — where-clause fragments are fixed constants,
# user input is always bound via parameters; temp fallback path mirrors bot runtime
"app/routers/admin/bot_admin.py" = ["S608", "S108", "S110"]
# Pre-existing: SQL injection warning in passthrough ClickHouse queries (sanitized, trusted internal traffic)
"app/databus/provider_implementations/passthrough.py" = ["S608"]
"app/domains/databus/providers/chains/local.py" = ["S608"]
# Pre-existing: internal-constant f-string SQL in price oracle (sanitized, trusted internal traffic)
"app/domains/scanner/engines/price_oracle.py" = ["S608"]
# News-event-to-price correlation: same pattern — parameterized values, trusted internal traffic
"app/domains/scanner/engines/event_correlation.py" = ["S608"]
# x402 enrichment label lookup: placeholders only, values always bound via ch.execute params
"app/routers/x402_enrichment/labels.py" = ["S608"]
# Pre-existing: internal-constant f-string SQL in volume authenticity (sanitized, trusted internal traffic)
"app/domains/scanner/engines/own_volume_authenticity.py" = ["S608"]
# Pre-existing: try/except/pass (existing scanner code), fire-and-forget task,
# and timeout parameter name conflict with asyncio.timeout (will be cleaned separately)
"app/domains/scanner/unified/scanner.py" = ["S110", "RUF006", "ASYNC109"]
# Same fire-and-forget task patterns, extracted to _finalize_helpers.py (wave 8)
"app/domains/scanner/unified/_finalize_helpers.py" = ["S110", "RUF006"]
# Pre-existing: variable naming conventions in middleware (will be cleaned separately)
"app/middleware_setup.py" = ["N806", "SIM102"]
# Postiz simulated analytics: random.random/randint for demo metrics, not crypto
"app/domains/postiz/services/templates.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# Pragmatic: don't break legacy, but enforce on new code.
exclude = [
    "_legacy_main.py",
    "app/legacy/",
    "app/_archive/",
    "alembic/versions/",
    "tests/",
]
# Tolerate missing imports for libraries without type stubs
ignore_missing_imports = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Domain layer is the strictest — no FastAPI leakage allowed.
module = ["app.domains.*"]
disallow_any_explicit = true
disallow_any_decorated = false  # Pydantic decorators need this
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
# Core (cross-cutting) is also strict.
module = ["app.core.*"]
disallow_any_explicit = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Legacy stays relaxed until migrated.
module = ["_legacy_main", "app.legacy.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that need docker/compose",
    "property: marks property-based tests using Hypothesis",
    "benchmark: marks performance benchmark tests",
    "e2e: marks end-to-end tests that need full system running",
    "data_quality: marks data/schema quality tests that need a running PostgreSQL instance",
]

# Hypothesis profiles are registered in conftest.py via hypothesis.settings.register_profile().
# See conftest.py or tests/conftest.py for `ci` and `dev` profile definitions.

# ── Custom size cap (not in pyproject.toml by default) ────────────────
# Enforced via .pre-commit-config.yaml custom check.

[tool.coverage.run]
source = ["app"]
omit = ["_legacy_main.py", "app/legacy/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60  # raise as migration progresses

[tool.deptry]
# Ignore noisy DEP003 (transitive dependency imports) and DEP002 (unused deps
# that are dev tools like ruff/mypy). Only DEP001 (missing dependency) matters.
ignore = ["DEP002", "DEP003"]

[tool.mutmut]
paths_to_mutate = ["app/"]
paths_to_exclude = ["tests/", "app/_archive/", "app/legacy/", "alembic/"]
runner = "python -m pytest -x --tb=short"
tests_dir = "tests/"
pre_mutation = ""
post_mutation = ""

[tool.interrogate]
fail-under = 60
ignore-init-method = true
ignore-init-module = true
exclude = ["tests/*", "alembic/*", "app/_archive/*", "app/legacy/*"]
