[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# Pragmatic: don't break legacy, but enforce on new code.
exclude = [
    "_legacy_main.py",
    "app/legacy/",
    "app/_archive/",
    "alembic/versions/",
    "tests/",
]
# Tolerate missing imports for libraries without type stubs
ignore_missing_imports = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Domain layer is the strictest — no FastAPI leakage allowed.
module = ["app.domains.*"]
disallow_any_explicit = true
disallow_any_decorated = false  # Pydantic decorators need this
no_implicit_optional = true
warn_return_any = true

[[tool.mypy.overrides]]
# Core (cross-cutting) is also strict.
module = ["app.core.*"]
disallow_any_explicit = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Legacy stays relaxed until migrated.
module = ["_legacy_main", "app.legacy.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that need docker/compose",
    "property: marks property-based tests using Hypothesis",
    "benchmark: marks performance benchmark tests",
    "e2e: marks end-to-end tests that need full system running",
    "data_quality: marks data/schema quality tests that need a running PostgreSQL instance",
]

# Hypothesis profiles are registered in conftest.py via hypothesis.settings.register_profile().
# See conftest.py or tests/conftest.py for `ci` and `dev` profile definitions.

# ── Custom size cap (not in pyproject.toml by default) ────────────────
# Enforced via .pre-commit-config.yaml custom check.

[tool.coverage.run]
source = ["app"]
omit = ["_legacy_main.py", "app/legacy/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60  # raise as migration progresses

[tool.deptry]
# Ignore noisy DEP003 (transitive dependency imports) and DEP002 (unused deps
# that are dev tools like ruff/mypy). Only DEP001 (missing dependency) matters.
ignore = ["DEP002", "DEP003"]

# mutmut 3.x — critical-path scope per AI Test Oracle Policy (auth first)
[tool.mutmut]
source_paths = ["app/domains/auth"]
also_copy = ["app"]
pytest_add_cli_args_test_selection = ["tests/unit/domain/auth"]
[tool.interrogate]
fail-under = 60
ignore-init-method = true
ignore-init-module = true
exclude = ["tests/*", "alembic/*", "app/_archive/*", "app/legacy/*"]


[tool.fleet-gates]
scan-roots = ["app", "src"]
