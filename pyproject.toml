[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Declare app/ as an installable package so `pip install -e ".[dev]"` registers
# it on sys.path. Without this, pytest collection fails outside the repo cwd
# (33/35 test files fail without PYTHONPATH=.).
# packages.find auto-discovers every sub-package that has __init__.py.
# Sub-packages without __init__.py are namespace packages and remain out of
# scope for Phase 1.3 (tracked for Phase 3).
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["app._archive*", "app._archive.**"]
namespaces = false

[tool.bandit]
# Baseline for legacy Medium/Low debt (matches ruff per-file-ignores + mypy baseline).
# Flagged for security-lead triage; new code is NOT exempt. Remove entries as triaged.
skips = [
    "B101", "B104", "B108", "B110", "B112", "B113", "B301", "B303",
    "B306", "B310", "B311", "B314", "B324", "B602", "B603", "B607", "B608", "B615",
]

[tool.ruff]
extend = "../standards/templates/ruff-base.toml"
line-length = 120
extend-exclude = [
    "_legacy_main.py",
    "app/legacy/",
    "app/_archive/",
    "alembic/versions/",
    "build/",
    "dist/",
]

[tool.ruff.lint]
# asyncio.timeout modernization (ASYNC109) is a preview style preference — the
# codebase's legacy asyncio.wait_for / timeout-param usage predates it. Tolerate
# it rather than churning runtime call sites for a stylistic rule.
ignore = ["ASYNC109"]

