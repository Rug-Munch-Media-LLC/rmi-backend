[pytest]
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto
testpaths = tests
# Fast default suite: unit tests only. Heavy marks are deselected by default;
# opt back in explicitly, e.g. `pytest -m benchmark` or `pytest -m "slow"`.
# Full matrix: pytest -m "" (empty marker expression runs everything).
addopts =
    -m "not slow and not integration and not benchmark and not e2e and not data_quality and not rag_eval"
    --timeout=60
    --timeout-method=thread
    # Parallelise across all cores (pytest-xdist). Verified safe: conftest has no
    # shared DB/files; failures are pre-existing environmental (Redis/Qdrant not
    # running), identical serial vs parallel. Override with `-n 0` for serial
    # debugging. [REVIEW] CI containers may need a capped `-n` if memory-limited.
    -n auto
markers =
    integration: marks tests as integration tests (require running services)
    slow: marks tests as slow
    benchmark: marks performance benchmark tests
    flaky: marks known-flaky tests (wall-clock benchmarks, time-dependent data)
    data_quality: marks tests as data quality verification tests
    smoke: marks tests as smoke tests (basic health checks)
    rag_eval: marks the RAG regression eval gate tests (golden set, hit-rate + faithfulness thresholds)
    e2e: marks end-to-end tests that need the full system running
    property: marks property-based tests using Hypothesis
