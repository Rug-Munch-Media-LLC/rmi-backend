# ── lefthook.yml — fast git hooks ──
# Source of truth: standards/templates/lefthook-base.yml
# Variant: python
# Install: lefthook install

pre-commit:
  parallel: true
  commands:
    no-env-files:
      run: |
        if find . -maxdepth 3 -name '.env' -not -name '.env.example' -not -path './.git/*' -not -path './node_modules/*' -not -path './venv/*' -not -path './.venv/*' | grep -q .; then
          echo "ERROR: .env files found. Move secrets to gopass (gopass show ...). See AGENTS.md hard-rule 6."
          find . -maxdepth 3 -name '.env' -not -name '.env.example' -not -path './.git/*' -not -path './node_modules/*' -not -path './venv/*' -not -path './.venv/*'
          exit 1
        fi
      skip:
        - merge
        - rebase
    gitleaks:
      run: gitleaks protect --staged --no-banner --verbose
    envsitter:
      run: envsitter validate --file .env 2>/dev/null || true
    squawk:
      glob: "*.sql"
      run: squawk {staged_files} 2>/dev/null || echo "  ⚠ squawk not available — skipping SQL lint"
    ruff:
      glob: "*.py"
      run: ruff check --fix {staged_files} && ruff format {staged_files}
      stage_fixed: true
pre-push:
  parallel: true
  commands:
    gitleaks-full:
      run: gitleaks detect --source . --no-git -v
    mypy:
      run: mypy app/ --ignore-missing-imports
    bandit:
      run: bandit -r app/ -ll
    test:
      run: python3 -m pytest tests/ -x -q -m "not integration"
commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1"
