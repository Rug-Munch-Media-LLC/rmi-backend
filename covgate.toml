# covgate — Diff coverage enforcement
# Only evaluates coverage on lines CHANGED in the current PR
# Uses LCOV format (generated by pytest-cov)

[gate]
threshold = 80  # 80% of changed lines must be covered
scope = "added"  # Only newly added lines (not modified)

[lcov]
paths = ["coverage.lcov"]

[exclude]
patterns = [
    "**/tests/**",
    "**/test_*.py",
    "**/conftest.py",
    "**/alembic/**",
    "**/_archive/**",
    "**/__init__.py",
]
