repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check app/ --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: mypy app/ --ignore-missing-imports
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: python -m pytest tests/ -x --tb=short
        language: system
        types: [python]
        pass_filenames: false
