# Spekto API Security Scanner configuration
# See: https://github.com/Shasheen8/Spekto
targets:
  - name: rmi-backend-api
    base_url: https://api.rugmunch.io
    protocol: rest
    auth_contexts:
      - ci-token

spec:
  openapi: openapi.json  # Auto-generated by FastAPI

rules:
  # Disable rules that don't apply
  exclude: []

scan:
  request_budget: 100
  timeout: "30s"
  # Safe defaults — no destructive operations
  safety_level: read_only
  allow_write: false
  allow_unsafe_rules: false
  body_capture: redacted
  follow_redirects: false

auth_contexts:
  - name: ci-token
    bearer_token_env: SPEKTO_BEARER_TOKEN
