coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 2%
    patch:
      default:
        target: 60%
        threshold: 5%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true

ignore:
  - "tests/"
  - "app/_archive/"
  - "app/legacy/"
  - "alembic/"
  - "_legacy_main.py"

flags:
  unittests:
    paths:
      - app/
    carryforward: true
