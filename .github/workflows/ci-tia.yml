name: CI — TIA Pilot + Quarantine Report

# Nightly + manual trigger for TIA pilot
on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        options:
          - full        # Full suite + build testmon map
          - tia         # TIA-optimized (affected tests only)
          - quarantine  # Quarantine-aware full run
        default: 'full'

jobs:
  tia-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for testmon diff

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          # pytest-testmon and pytest-rerunfailures are in dev extras

      - name: Restore testmon cache
        uses: actions/cache@v4
        with:
          path: .testmon
          key: testmon-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            testmon-${{ runner.os }}-

      - name: Run tests (Full + Build TIA map)
        if: github.event.inputs.mode == 'full' || github.event_name == 'schedule'
        run: |
          pytest --testmon -v --tb=short -n 4 2>&1 | tee test-results-full.log
        timeout-minutes: 45

      - name: Run tests (TIA Optimized)
        if: github.event.inputs.mode == 'tia'
        run: |
          pytest --testmon -v --tb=short -n 4 2>&1 | tee test-results-tia.log
        timeout-minutes: 30

      - name: Run tests (Quarantine Aware)
        if: github.event.inputs.mode == 'quarantine'
        run: |
          pytest --testmon -v --tb=short -n 4 2>&1 | tee test-results-quarantine.log
        timeout-minutes: 45

      - name: Upload testmon data
        uses: actions/upload-artifact@v4
        with:
          name: testmon-data
          path: .testmon/
          retention-days: 7

      - name: Quarantine Summary
        if: always()
        run: |
          if grep -q "QUARANTINE SUMMARY" test-results-*.log 2>/dev/null; then
            echo "## Quarantine Report" >> $GITHUB_STEP_SUMMARY
            grep -A 50 "QUARANTINE SUMMARY" test-results-*.log | head -60 >> $GITHUB_STEP_SUMMARY
          else
            echo "No quarantined tests in this run" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Testmon Summary
        if: always()
        run: |
          echo "## Testmon Statistics" >> $GITHUB_STEP_SUMMARY
          if [ -f .testmon/.testmondata ]; then
            python3 -c "
import json
with open('.testmon/.testmondata') as f:
    data = json.load(f)
print(f'Tests tracked: {len(data.get(\"tests\", {}))}')
print(f'Files tracked: {len(data.get(\"files\", {}))}')
print(f'Last updated: {data.get(\"mtime\", \"unknown\")}')
" >> $GITHUB_STEP_SUMMARY
          else
            echo "No testmon data file found" >> $GITHUB_STEP_SUMMARY
          fi