# CI/CD Pipeline for RMI Backend

name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Typecheck with mypy
        run: mypy app/

      - name: Security scan with bandit
        run: bandit -r app/ -ll

      - name: Secret scan with gitleaks
        run: gitleaks detect --source .

      - name: Run unit tests
        run: pytest tests/unit/ -x --tb=short --maxfail=5

      - name: Run integration tests (allow failure)
        run: pytest tests/integration/ -x --tb=short --maxfail=5 || true

  trivy-scan:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - name: Scan backend image for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend-rmi-backend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
