name: CI — Quality Gates
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install ruff mypy pytest pytest-cov pytest-asyncio

      - name: Lint
        run: ruff check app/ --select=E,F,B,SIM,ASYNC --ignore=S104,S311

      - name: Type Check
        run: mypy app/ --ignore-missing-imports --check-untyped-defs 2>&1 | tail -20 || true

      - name: Security Scan
        run: bandit -r app/ -ll 2>&1 | tail -10 || true

      - name: Tests
        run: python -m pytest tests/ -v --tb=short --cov=app.domains.scanner --cov=app --cov-report=term --cov-fail-under=15 2>&1 | tail -40

      - name: Import Check
        run: |
          python -c "from app.factory import create_app; app = create_app(); print('Routes: %d' % len(app.routes))"

      # Fleet coding gates (canonical: standards/fleet/gates) — BLOCKING ratchets.
      - name: Structure gate (<=200 firm, shrink-only allowlist)
        run: python3 scripts/check-structure.py --repo . --scan-root app --scan-root src

      - name: Monkeypatch ratchet (decrease-only)
        run: python3 scripts/check-monkeypatch.py --repo .

      - name: Antipattern ratchet (per-repo baseline)
        run: python3 scripts/check-antipatterns.py --repo .

      - name: Gate self-test (proves each gate catches its violation class)
        run: bash scripts/ci-gate-selftest.sh

  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Install archfit
        run: go install github.com/alexei-led/archfit/cmd/archfit@latest || echo "archfit install skipped"
        continue-on-error: true
      - name: Run architecture fitness check
        run: |
          if command -v archfit &>/dev/null; then
            archfit analyze || echo "Architecture fitness: review needed"
          else
            echo "archfit not installed — skipping (non-blocking)"
          fi
        continue-on-error: true
