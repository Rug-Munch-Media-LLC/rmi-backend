---
name: CI — Quality Gates
on:
  push: {}
  pull_request: {}
jobs:
  # ── SLSA Provenance (GitHub Actions mirror only) ────────────────
  # Constraint: slsa-framework/slsa-github-generator reusable workflow
  # requires GitHub Actions OIDC identity (id-token:write) and GitHub
  # Actions reusable workflow syntax. Forgejo runners do not provide
  # these, so provenance attestation is limited to the GitHub mirror.
  # The container image is built and pushed by Forgejo CI
  # (.forgejo/workflows/ci.yml sign-image job); this job attests to
  # that image using GitHub's OIDC identity. Skips cleanly when the
  # registry token secret is absent or the image is not yet available.
  # ────────────────────────────────────────────────────────────────
  slsa-provenance:
    name: SLSA Provenance (L3)
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Set up Docker BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> "$GITHUB_ENV"
      - name: Pull and resolve image digest
        id: resolve
        env:
          IMAGE: registry.rugmunch.io/rmi-backend:${{ github.sha }}
        run: |
          if [ -z "${{ secrets.IMAGE_REGISTRY_TOKEN }}" ]; then
            echo "registry_auth=missing" >> "$GITHUB_OUTPUT"
            echo "⚠️ IMAGE_REGISTRY_TOKEN not set — SLSA provenance skipped (non-breaking)"
            exit 0
          fi
          echo "${{ secrets.IMAGE_REGISTRY_TOKEN }}" | docker login registry.rugmunch.io -u "${{ github.actor }}" --password-stdin
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Digest}}')
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "registry_auth=present" >> "$GITHUB_OUTPUT"
            echo "✅ Resolved digest: $DIGEST"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "registry_auth=present" >> "$GITHUB_OUTPUT"
            echo "⚠️ Image not yet in registry — SLSA provenance skipped (non-breaking)"
          fi
      - name: Generate SLSA Build L3 provenance attestation
        if: steps.resolve.outputs.digest != ''
        continue-on-error: true
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v1.10.0
        with:
          image: registry.rugmunch.io/rmi-backend:${{ github.sha }}
          digest: ${{ steps.resolve.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.IMAGE_REGISTRY_TOKEN }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install ruff mypy pytest pytest-cov pytest-asyncio
      - name: Lint
        run: ruff check app/ --select=E,F,B,SIM,ASYNC --ignore=S104,S311
      - name: Type Check
        run: |
          mypy app/ --ignore-missing-imports --check-untyped-defs 2>&1 | tail -20 || true
      - name: Security Scan
        run: |
          bandit -r app/ -ll 2>&1 | tail -10 || true
      - name: Tests
        # Coverage floor aligned to .forgejo/workflows/ci.yml (60).
        # If this gate fails in CI, ratchet to the highest passing value and
        # update this comment — do not disable coverage measurement.
        run: |
          python -m pytest tests/ -v --tb=short --cov=app.domains.scanner --cov=app --cov-report=term --cov-fail-under=60 --ignore-glob='tests/domains/test_adminbot_*' 2>&1 | tail -40
      - name: Import Check
        run: |
          python -c "from app.factory import create_app; app = create_app(); print('Routes: %d' % len(app.routes))"
      # Fleet coding gates (canonical: standards/fleet/gates) — BLOCKING ratchets.
      - name: Structure gate (<=200 firm, shrink-only allowlist)
        run: |
          python3 scripts/check-structure.py --repo . --scan-root app --scan-root src
      - name: Monkeypatch ratchet (decrease-only)
        run: |
          python3 scripts/check-monkeypatch.py --repo .
      - name: Antipattern ratchet (per-repo baseline)
        run: |
          python3 scripts/check-antipatterns.py --repo .
      - name: Gate self-test (proves each gate catches its violation class)
        run: |
          bash scripts/ci-gate-selftest.sh
  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install archfit
        run: |
          go install github.com/alexei-led/archfit/cmd/archfit@latest || echo "archfit install skipped"
        continue-on-error: true
      - name: Run architecture fitness check
        run: |
          if command -v archfit &>/dev/null; then
            archfit analyze || echo "Architecture fitness: review needed"
          else
            echo "archfit not installed — skipping (non-blocking)"
          fi
        continue-on-error: true
  changelog-check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: |
          curl -fsSL https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-musl.tar.gz -o /tmp/git-cliff.tar.gz
          tar xzf /tmp/git-cliff.tar.gz -C /usr/local/bin --strip-components=1 git-cliff-2.13.1/git-cliff
          git-cliff --version
      - name: Generate changelog (to temp file) and verify non-empty
        run: |
          git-cliff --config cliff.toml --output /tmp/CHANGELOG.generated.md
          if [ ! -s /tmp/CHANGELOG.generated.md ]; then
            echo "❌ git-cliff produced an empty changelog for tag ${{ github.ref_name }}"
            exit 1
          fi
          echo "✅ Changelog generated ($(wc -l < /tmp/CHANGELOG.generated.md) lines)"
          head -40 /tmp/CHANGELOG.generated.md